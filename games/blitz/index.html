<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>True/False Blitz — TRSS Games</title>
<style>
  :root{
    --bg:#101418; --card:#1c232b; --ink:#f2f5f7; --muted:#9aa7b2;
    --true:#2ecc71; --false:#e74c3c; --accent:#3aa0ff;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    padding:.6rem .9rem;
  }
  header a.back, header button.restart{
    background:#242d36; color:var(--ink); border:1px solid #333f4b;
    border-radius:10px; padding:.55rem .9rem; font-size:1rem;
    text-decoration:none; cursor:pointer; min-height:44px;
  }
  header button.restart:active{transform:scale(.96);}
  #hud{
    display:flex; gap:.5rem; align-items:stretch; justify-content:center;
    padding:.4rem .9rem; flex-wrap:wrap;
  }
  .hud-box{
    background:var(--card); border-radius:var(--radius); padding:.5rem .9rem;
    text-align:center; min-width:86px;
  }
  .hud-box .lbl{font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .hud-box .val{font-size:1.35rem; font-weight:700;}
  #timer-box.warn .val{color:var(--false); animation:pulse .6s infinite alternate;}
  @keyframes pulse{from{opacity:1}to{opacity:.45}}
  #streak-box.hot .val{color:var(--true);}
  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:.6rem .9rem 1rem; max-width:640px; width:100%; margin:0 auto;}
  .screen{display:none; flex-direction:column; gap:1rem;}
  .screen.active{display:flex;}
  h1{font-size:1.6rem; margin:.4rem 0; text-align:center;}
  h2{font-size:1.3rem; margin:.2rem 0; text-align:center;}
  p.hint{text-align:center; color:var(--muted); font-size:.95rem;}
  .chapters{display:grid; grid-template-columns:1fr 1fr; gap:.6rem;}
  .chapters button{
    background:var(--card); color:var(--ink); border:2px solid #333f4b;
    border-radius:var(--radius); padding:1rem .6rem; font-size:1.05rem; font-weight:600;
    cursor:pointer; min-height:64px;
  }
  .chapters button.selected{border-color:var(--accent); background:#1e2b3a;}
  .big-btn{
    border:none; border-radius:var(--radius); color:#fff;
    font-size:1.3rem; font-weight:700; padding:1.1rem; cursor:pointer;
    min-height:64px;
  }
  .big-btn:active{transform:scale(.97);}
  #start-btn,#play-again-btn{background:var(--accent);}
  #qcard{
    background:var(--card); border-radius:var(--radius); padding:1.2rem;
    min-height:220px; display:flex; flex-direction:column; justify-content:center; gap:.8rem;
    transition:background-color .12s ease;
  }
  #qcard.correct{background:#173b28;}
  #qcard.wrong{background:#3d1a16;}
  #term{font-size:1.5rem; font-weight:800; text-align:center;}
  #defn{font-size:1.05rem; color:#cfd8df; text-align:center; line-height:1.45;}
  #feedback{min-height:1.6rem; text-align:center; font-weight:700; font-size:1.05rem;}
  #feedback.good{color:var(--true);}
  #feedback.bad{color:var(--false);}
  #tf-row{display:grid; grid-template-columns:1fr 1fr; gap:.7rem;}
  #true-btn{background:var(--true);}
  #false-btn{background:var(--false);}
  #true-btn:disabled,#false-btn:disabled{opacity:.55;}
  #keys-hint{text-align:center; color:var(--muted); font-size:.8rem;}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:.6rem;}
  .stat{background:var(--card); border-radius:var(--radius); padding:.8rem; text-align:center;}
  .stat .lbl{font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .stat .val{font-size:1.5rem; font-weight:700;}
  #new-best{
    display:none; text-align:center; font-size:1.4rem; font-weight:800; color:#ffd54a;
    animation:pulse .5s infinite alternate;
  }
  #new-best.show{display:block;}
  #error-msg{background:#3d1a16; border:1px solid var(--false); border-radius:var(--radius);
    padding:1rem; text-align:center; display:none;}
  @media (min-width:700px){
    #qcard{min-height:260px;}
    .chapters{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
  <header>
    <a class="back" href="../">← Games</a>
    <button class="restart" id="restart-top" type="button">↻ Restart</button>
  </header>
  <div id="hud" hidden>
    <div class="hud-box" id="timer-box"><div class="lbl">Time</div><div class="val" id="timer">60</div></div>
    <div class="hud-box"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
    <div class="hud-box" id="streak-box"><div class="lbl">Streak</div><div class="val" id="streak">×0</div></div>
    <div class="hud-box"><div class="lbl">Best</div><div class="val" id="best-hud">0</div></div>
  </div>
  <main>
    <div id="error-msg"></div>

    <!-- START SCREEN -->
    <section class="screen active" id="start-screen">
      <h1>⚡ True/False Blitz</h1>
      <p class="hint">A term + a definition appears. Tap <strong>TRUE</strong> if the definition matches the term, <strong>FALSE</strong> if it's a fake-out. 60 seconds — how many can you clear?</p>
      <div class="chapters" id="chapter-picker"></div>
      <button class="big-btn" id="start-btn" type="button">▶ Start</button>
      <p class="hint" id="keys-hint">Keyboard: T = true · F = false</p>
    </section>

    <!-- GAME SCREEN -->
    <section class="screen" id="game-screen">
      <div id="qcard">
        <div id="term"></div>
        <div id="defn"></div>
      </div>
      <div id="feedback"></div>
      <div id="tf-row">
        <button class="big-btn" id="true-btn" type="button">TRUE</button>
        <button class="big-btn" id="false-btn" type="button">FALSE</button>
      </div>
    </section>

    <!-- GAME OVER SCREEN -->
    <section class="screen" id="over-screen">
      <h2>⏱ Time's up!</h2>
      <div id="new-best">🏆 NEW BEST!</div>
      <div class="stats">
        <div class="stat"><div class="lbl">Score</div><div class="val" id="final-score">0</div></div>
        <div class="stat"><div class="lbl">Best</div><div class="val" id="final-best">0</div></div>
        <div class="stat"><div class="lbl">Answered</div><div class="val" id="final-answered">0</div></div>
        <div class="stat"><div class="lbl">Accuracy</div><div class="val" id="final-accuracy">0%</div></div>
      </div>
      <button class="big-btn" id="play-again-btn" type="button">↻ Play Again</button>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
