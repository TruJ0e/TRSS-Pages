<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Term Hop — TRSS Games</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #0e1626; color: #eef3ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; }
  #hud {
    display: flex; align-items: center; gap: 8px;
    padding: calc(6px + env(safe-area-inset-top)) 10px 6px;
    background: #131f36; border-bottom: 1px solid #24334f;
  }
  #hud .back { color: #9fd0ff; text-decoration: none; font-size: 15px; white-space: nowrap; }
  #hud .scorebox { margin-left: auto; font-size: 14px; color: #c6d5ee; }
  #hud .scorebox b { color: #fff; font-size: 17px; }
  #lives { color: #ff6b81; font-size: 15px; letter-spacing: 2px; min-width: 58px; text-align: center; }
  .iconbtn {
    font-size: 18px; background: #22314e; color: #fff; border: 1px solid #33456b;
    border-radius: 8px; padding: 4px 10px; cursor: pointer; line-height: 1;
  }
  .iconbtn:active { background: #2e4166; }
  #chapters {
    display: flex; gap: 6px; padding: 6px 10px;
    background: #101a2e; border-bottom: 1px solid #24334f; overflow-x: auto;
  }
  #chapters button {
    flex: 1 0 auto; font-size: 13px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid #33456b; background: #1a2742; color: #c6d5ee; cursor: pointer;
  }
  #chapters button.active { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: 600; }
  #defbar {
    padding: 8px 12px; background: #16223a; border-bottom: 1px solid #24334f;
    font-size: 14px; line-height: 1.35; min-height: 52px;
  }
  #defbar .k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8ea3c4; }
  #deftext {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: #fff; font-weight: 500;
  }
  #stage { position: relative; flex: 1; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: absolute; inset: 0; display: block; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 13, 24, 0.82); z-index: 5; padding: 20px; text-align: center;
  }
  #overlay.hidden { display: none; }
  .panel { max-width: 340px; width: 100%; }
  .panel h1 { margin: 0 0 6px; font-size: 26px; }
  .panel p { margin: 6px 0 14px; color: #aebfdd; font-size: 14px; line-height: 1.45; }
  .bigbtn {
    display: block; width: 100%; margin: 8px 0; font-size: 18px; font-weight: 700;
    padding: 14px; border-radius: 12px; border: none; cursor: pointer;
    background: #2f6fed; color: #fff;
  }
  .bigbtn:active { background: #265fd6; }
  .bigbtn.ghost { background: #22314e; border: 1px solid #33456b; }
  .stat { font-size: 16px; margin: 4px 0; color: #dbe6fa; }
  .stat b { color: #ffd166; font-size: 22px; }
  .hint { font-size: 12px; color: #7c90b5; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <a class="back" href="../">← Games</a>
    <div class="scorebox">Score <b id="score">0</b></div>
    <div id="lives" aria-label="Lives">♥♥♥</div>
    <button id="restart" class="iconbtn" aria-label="Restart game">↻</button>
  </header>
  <nav id="chapters" aria-label="Chapter"></nav>
  <div id="defbar"><span class="k">Find the term for</span><span id="deftext">Pick a chapter and tap Start.</span></div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay"><div class="panel" id="panel"></div></div>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
