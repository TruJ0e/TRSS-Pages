<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Type Rush — TRSS Games</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f2ec; color: #1d1d1f;
    overscroll-behavior: none;
  }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: #1d1d1f; color: #fff;
    flex: 0 0 auto;
  }
  #topbar a.back, #topbar button.linklike {
    color: #fff; text-decoration: none; font-size: 15px;
    background: none; border: none; cursor: pointer; padding: 4px 2px;
    font-family: inherit;
  }
  #topbar .title { font-weight: 700; font-size: 16px; flex: 1; text-align: center; }
  #topbar .spacer { width: 60px; }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; font-size: 14px; background: #fff;
    border-bottom: 1px solid #ddd; flex: 0 0 auto;
  }
  #hud .stat b { font-size: 16px; }
  #lives { color: #d33; letter-spacing: 2px; font-size: 16px; }

  /* ---------- playfield ---------- */
  #field {
    position: relative; flex: 1 1 auto; min-height: 0;
    overflow: hidden; background: #eef3f7;
    touch-action: none; /* prevent page scroll while playing */
  }
  #field.hit { animation: hitflash .25s; }
  @keyframes hitflash { 0% { background: #f6c9c9; } 100% { background: #eef3f7; } }
  .chip {
    position: absolute; top: 0; left: 0;
    max-width: 88%; width: max-content;
    background: #fff; border: 2px solid #2b6cb0; border-radius: 10px;
    padding: 8px 12px; font-size: 14px; line-height: 1.3;
    box-shadow: 0 2px 6px rgba(0,0,0,.18);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; will-change: transform;
  }
  @media (min-width: 720px) { .chip { max-width: 340px; font-size: 15px; } }
  #deadline {
    position: absolute; left: 0; right: 0; bottom: 4px;
    border-top: 3px dashed #d33; pointer-events: none;
  }
  #deadline span {
    position: absolute; right: 6px; top: -20px;
    font-size: 11px; color: #d33; font-weight: 700; text-transform: uppercase;
  }

  /* ---------- input bar ---------- */
  #inputbar {
    flex: 0 0 auto; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid #ddd;
  }
  #guess {
    width: 100%; font-size: 16px; /* 16px prevents iOS auto-zoom */
    padding: 12px; border: 2px solid #2b6cb0; border-radius: 10px;
    font-family: inherit;
  }
  #guess:focus { outline: none; border-color: #1a4f8a; }

  /* ---------- focus pill (tap to focus) ---------- */
  #focuspill {
    position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%);
    background: #1d1d1f; color: #fff; border: none; border-radius: 999px;
    padding: 10px 18px; font-size: 15px; cursor: pointer; z-index: 30;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }

  /* ---------- screens (menu / game over / error) ---------- */
  .screen {
    flex: 1 1 auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center; overflow-y: auto;
  }
  .screen h1 { margin: 0; font-size: 28px; }
  .screen p { margin: 0; color: #555; max-width: 340px; line-height: 1.5; }
  .chapbtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chapbtn {
    padding: 12px 18px; font-size: 16px; border-radius: 10px;
    border: 2px solid #2b6cb0; background: #fff; color: #2b6cb0;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .chapbtn.sel { background: #2b6cb0; color: #fff; }
  .bigbtn {
    padding: 14px 34px; font-size: 18px; font-weight: 700; border-radius: 12px;
    border: none; background: #2b6cb0; color: #fff; cursor: pointer;
    font-family: inherit;
  }
  .bigbtn:disabled { opacity: .5; cursor: default; }
  .bigbtn.ghost { background: #fff; color: #2b6cb0; border: 2px solid #2b6cb0; }
  #overstats { font-size: 17px; line-height: 2; }
  #overstats b { font-size: 20px; }
  #newbest { color: #1a7a2e; font-weight: 700; font-size: 18px; }
  #errbox {
    background: #fff; border: 2px solid #d33; border-radius: 12px;
    padding: 20px; max-width: 380px; color: #333;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="back" href="../">← Games</a>
    <div class="title">Type Rush</div>
    <button class="linklike" id="restartbtn" hidden>↻ Restart</button>
    <div class="spacer" id="restartspacer"></div>
  </header>

  <!-- start screen -->
  <section class="screen" id="menu">
    <h1>⌨️ Type Rush</h1>
    <p>Definitions fall toward the deadline. Type the matching term before one crosses the line — you have 3 lives.</p>
    <div class="chapbtns" id="chapbtns"></div>
    <button class="bigbtn" id="startbtn">Start</button>
    <p id="menubest"></p>
  </section>

  <!-- game screen -->
  <section id="game" hidden style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;">
    <div id="hud">
      <div class="stat">Score <b id="score">0</b></div>
      <div class="stat">Best <b id="besthud">0</b></div>
      <div class="stat">Cleared <b id="cleared">0</b></div>
      <div id="lives">♥♥♥</div>
    </div>
    <div id="field">
      <div id="deadline"><span>deadline</span></div>
      <button id="focuspill" hidden>⌨️ Tap to focus</button>
    </div>
    <div id="inputbar">
      <input id="guess" type="text" placeholder="Type the term…" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    </div>
  </section>

  <!-- game over screen -->
  <section class="screen" id="over" hidden>
    <h1>Game Over</h1>
    <div id="newbest" hidden>🎉 New best!</div>
    <div id="overstats"></div>
    <button class="bigbtn" id="againbtn">↻ Play Again</button>
    <button class="bigbtn ghost" id="changebtn">Change Chapter</button>
  </section>

  <!-- load error screen -->
  <section class="screen" id="load-error" hidden>
    <div id="errbox">
      <h2 style="margin-top:0">Couldn't load cards</h2>
      <p id="errmsg"></p>
      <p style="margin-top:12px">
        <button class="bigbtn" id="retrybtn">Retry</button>
        <a href="../" class="bigbtn ghost" style="text-decoration:none;display:inline-block;margin-top:8px">← Games</a>
      </p>
    </div>
  </section>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
